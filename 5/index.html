<!-- boiling-ink filters -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="boil1" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/>
    </filter>
    <filter id="boil2" x="-8%" y="-8%" width="116%" height="116%">

<main class="threshold">

  <div class="moonwrap">
    <svg class="moon-svg" viewBox="0 0 120 120" role="img" aria-label="tonight's moon, at its true phase">
      <defs>
        <mask id="ph">
          <rect width="120" height="120" fill="#fff"/>
          <circle class="phase-shadow" cx="60" cy="60" r="53" fill="#000"/>
        </mask>
      </defs>
      <circle class="moon-halo" cx="60" cy="60" r="55"/>
      <circle class="moon-rim" cx="60" cy="60" r="50"/>
      <g mask="url(#ph)">
        <circle class="moon-face" cx="60" cy="60" r="50"/>
        <circle class="crater" cx="46" cy="45" r="7"/>
        <circle class="crater" cx="70" cy="61" r="10"/>
        <circle class="crater" cx="51" cy="77" r="5"/>
      </g>
    </svg>
  </div>
  <p class="tithi"><span class="tithi-text">tonight's moon, over Vadodara</span></p>

  <section class="oracle" id="oracle" aria-live="polite">
    <p class="invocation">Peoples Theatre Laboratory · Vadodara — a doha drawn for you</p>
    <p class="doha-dev" id="dohaDev" lang="hi">मोको कहाँ ढूँढे बन्दे,<br>मैं तो तेरे पास में।</p>
    <p class="doha-en" id="dohaEn">Where do you go looking for me, friend? I am right here beside you.</p>
    <p class="doha-poet" id="dohaPoet">कबीर — Kabir</p>
    <button class="draw-again" id="drawAgain">एक और — draw another</button>
  </section>
